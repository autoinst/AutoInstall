name: Go CI

on:
  push:
    branches:
      - master
  workflow_call:
    inputs:
      build-version:
        description: Version injected by the release workflow
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Test
        run: go test ./...

      - name: Vet
        run: go vet ./...

      - name: Race test (Linux amd64)
        env:
          CGO_ENABLED: 1
        run: go test -race ./...

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        goarch: [amd64, '386', arm64, arm]

    runs-on: ubuntu-latest
    env:
      GOOS: linux
      GOARCH: ${{ matrix.goarch }}
      GOAMD64: v1
      CGO_ENABLED: 0
      BUILD_NAME: AutoInstall-linux-${{ matrix.goarch }}-v1

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        env:
          BUILD_VERSION: ${{ inputs.build-version }}
        run: bash ./build.sh

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BUILD_NAME }}
          path: dist/${{ env.BUILD_NAME }}
          if-no-files-found: error
